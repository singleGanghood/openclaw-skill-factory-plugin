name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Validate plugin manifest & bundled skills
        run: node scripts/validate.mjs
      - name: Publish to npm
        run: |
          npm publish --access public
          VERSION="${GITHUB_REF_NAME#v}"
          npm dist-tag add openclaw-skill-factory-plugin@${VERSION} ${GITHUB_REF_NAME}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
